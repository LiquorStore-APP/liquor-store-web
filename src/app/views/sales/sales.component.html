<div class="container">
  <h1>Ventas</h1>
  <table mat-table [dataSource]="ventas" class="mat-elevation-z8">

    <!-- ID Venta -->
    <ng-container matColumnDef="idVenta">
      <th mat-header-cell *matHeaderCellDef>ID Venta</th>
      <td mat-cell *matCellDef="let venta">{{ venta.idVenta }}</td>
    </ng-container>

    <!-- Cliente -->
    <ng-container matColumnDef="clienteVenta">
      <th mat-header-cell *matHeaderCellDef>Cliente</th>
      <td mat-cell *matCellDef="let venta">{{ venta.clienteVenta }}</td>
    </ng-container>

    <!-- Fecha -->
    <ng-container matColumnDef="fechaVenta">
      <th mat-header-cell *matHeaderCellDef>Fecha</th>
      <td mat-cell *matCellDef="let venta">{{ venta.fechaVenta | date: 'short' }}</td>
    </ng-container>

    <!-- Monto Total -->
    <ng-container matColumnDef="montoTotalVenta">
      <th mat-header-cell *matHeaderCellDef>Monto Total</th>
      <td mat-cell *matCellDef="let venta">{{ venta.montoTotalVenta | currency }}</td>
    </ng-container>

    <!-- Utilidad Total -->
    <ng-container matColumnDef="utilidadTotalVenta">
      <th mat-header-cell *matHeaderCellDef>Utilidad Total</th>
      <td mat-cell *matCellDef="let venta">{{ venta.utilidadTotalVenta | currency }}</td>
    </ng-container>

    <!-- Acciones -->
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let venta">
        <button mat-button (click)="verDetalle(venta)">Ver Detalle</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
